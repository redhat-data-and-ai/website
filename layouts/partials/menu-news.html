<nav class="pf-c-nav pf-m-light sticky" aria-label="News navigation">
  <ul class="pf-c-nav__list">
    <li class="pf-c-nav__item">
      <a href="/news/" class="pf-c-nav__link {{ if eq .Kind "section" }}pf-m-current{{ end }}">
        <span class="pf-c-icon pf-m-md pf-m-inline">
          <span class="pf-c-icon__content">
            <i class="fas fa-angle-left" aria-hidden="true"></i>
          </span>
        </span>
        <span style="padding-left: 10px;">All News</span>
      </a>
    </li>
    {{ $news := where .Site.RegularPages "Section" "news" }}
    {{ range $news.ByDate }}
    <li class="pf-c-nav__item">
      <a href="{{ .RelPermalink }}"
         class="pf-c-nav__link {{ if eq $.RelPermalink .RelPermalink }}pf-m-current{{ end }}"
         style="padding-left: 32px;">
        <span class="wrappable">{{ .Title }}</span>
      </a>
    </li>
    {{ end }}
  </ul>
</nav>
